const formatINR = (amount) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);

// --- MAIN COMPONENTS ---

const Navbar = ({ cartCount, onOpenCart, onNavigate, activePage }) => {
    const [scrolled, setScrolled] = useState(false);
    useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    const navLinks = [ {id:'home', label:'Home'}, {id:'collections', label:'Collections'}, {id:'products', label:'Products'}, {id:'inspiration', label:'Inspiration'}, {id:'about', label:'About'}, {id:'contact', label:'Contact'} ];

    return (
        <header className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'glass-nav py-3' : 'bg-transparent py-5'}`}>
            <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                <div className="font-serif text-3xl font-bold tracking-wider cursor-pointer text-charcoal" onClick={() => onNavigate('home')}>AURA.</div>
                <nav className="hidden md:flex items-center space-x-8 text-sm uppercase tracking-widest text-charcoal font-medium">
                    {navLinks.map(link => (
                        <button key={link.id} onClick={() => onNavigate(link.id)} className={`hover:text-wood transition-colors ${activePage === link.id ? 'border-b-2 border-wood pb-1' : 'pb-1 border-b-2 border-transparent'}`}>{link.label}</button>
                    ))}
                </nav>
                <div className="flex items-center space-x-6">
                    <button onClick={() => onNavigate('contact')} className="hidden sm:block text-xs font-semibold uppercase tracking-widest border border-charcoal px-5 py-2 hover:bg-charcoal hover:text-white transition-all">Book Consultation</button>

                    </button>
                </div>
            </div>
        </header>
    );
};

                Curated designs. Premium comfort. Crafted for refined living. Discover collections that transform houses into bespoke sanctuaries.
            </motion.p>
            <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} transition={{ duration: 0.8, delay: 0.6 }} className="flex flex-col sm:flex-row justify-center gap-4">

                <button onClick={() => onNavigate('contact')} className="bg-white text-charcoal px-8 py-4 uppercase tracking-widest text-sm font-medium border border-transparent hover:border-charcoal transition-all luxury-shadow">Book Consultation</button>

const SectionTitle = ({ title, subtitle, center = false }) => (

const CategoryShowcase = ({ onNavigate }) => (

                {CATEGORIES.map((cat, i) => (
                    <motion.div initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: i * 0.1 }} key={cat.id} 
                        className="group relative cursor-pointer overflow-hidden rounded-sm"

                    >
                        <div className="aspect-[4/5] bg-gray-200 overflow-hidden">

                            <div>
                                <h3 className="text-white text-xl font-serif mb-1 group-hover:text-champagne transition-colors">{cat.name}</h3>
                                <p className="text-white/80 text-xs uppercase tracking-widest flex items-center gap-2">
                                    Shop Now <i className="ph ph-arrow-right group-hover:translate-x-2 transition-transform"></i>

                            </div>

                ))}

const ProductCard = ({ product, onOpenDetail }) => (
    <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className="group flex flex-col cursor-pointer bg-white" onClick={() => onOpenDetail(product)}>
        <div className="relative aspect-square overflow-hidden bg-offWhite mb-4">
            {product.badge && <span className="absolute top-4 left-4 z-10 bg-white text-charcoal text-[10px] uppercase font-bold px-3 py-1 shadow-sm">{product.badge}</span>}
            <img src={product.img} alt={product.name} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
            <div className="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity flex items-end justify-center pb-6">
                <button className="bg-white text-charcoal px-6 py-3 text-xs uppercase tracking-widest font-semibold hover:bg-wood hover:text-white transition-colors luxury-shadow translate-y-4 group-hover:translate-y-0 duration-300">Quick View</button>
            </div>
        </div>
        <div className="flex justify-between items-start">
            <div>
                <p className="text-xs text-gray-400 capitalize mb-1">{product.category}</p>
                <h3 className="font-serif text-lg text-charcoal font-medium">{product.name}</h3>
            </div>
            <div className="text-right">
                <p className="text-charcoal font-medium">{formatINR(product.price)}</p>
                {product.original && <p className="text-xs text-gray-400 line-through">{formatINR(product.original)}</p>}
            </div>
        </div>
    </motion.div>
);

const ProductShowcase = ({ onOpenDetail }) => {
    const [filter, setFilter] = useState('all');
    const [search, setSearch] = useState('');
    
    const filteredProducts = PRODUCTS.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.subcat.toLowerCase().includes(search.toLowerCase());
        const matchFilter = filter === 'all' || p.category === filter;
        return matchSearch && matchFilter;
    });

    return (
        <section className="py-24 bg-offWhite min-h-screen">
            <div className="max-w-7xl mx-auto px-6">
                <SectionTitle title="Exclusive Furniture Catalog" subtitle="Masterpieces" />
                
                {/* Filters & Search */}
                <div className="flex flex-col md:flex-row justify-between items-center mb-12 gap-6 border-b border-gray-200 pb-6">
                    <div className="flex flex-wrap gap-4 text-sm font-medium text-gray-500 uppercase tracking-wider">
                        <button onClick={()=>setFilter('all')} className={`${filter==='all'?'text-charcoal border-b border-charcoal':'hover:text-charcoal'}`}>All</button>
                        {CATEGORIES.map(c => (
                            <button key={c.id} onClick={()=>setFilter(c.id)} className={`${filter===c.id?'text-charcoal border-b border-charcoal':'hover:text-charcoal'}`}>{c.name}</button>
                        ))}
                    </div>
                    <div className="relative w-full md:w-64">
                        <i className="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Search furniture..." className="w-full bg-transparent border border-gray-300 py-2 pl-10 pr-4 focus:outline-none focus:border-wood text-sm" value={search} onChange={e=>setSearch(e.target.value)} />
                    </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-12">
                    {filteredProducts.map(p => <ProductCard key={p.id} product={p} onOpenDetail={onOpenDetail} />)}
                </div>
                {filteredProducts.length === 0 && <div className="text-center text-gray-500 py-12">No products found matching your luxury criteria.</div>}
            </div>
        </section>
    );
};

const ProductDetailModal = ({ product, onClose, onAddToCart }) => {
    const [activeTab, setActiveTab] = useState('about');
    const [qty, setQty] = useState(1);
    
    if(!product) return null;

    useEffect(() => { document.body.style.overflow = 'hidden'; return () => document.body.style.overflow = 'unset'; }, []);

    return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center">
            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={onClose} className="absolute inset-0 bg-black/60 backdrop-blur-sm"></motion.div>
            <motion.div initial={{ opacity: 0, scale: 0.9, y: 30 }} animate={{ opacity: 1, scale: 1, y: 0 }} exit={{ opacity: 0, scale: 0.9, y: 30 }} className="relative bg-white w-full max-w-6xl max-h-[90vh] overflow-y-auto m-4 luxury-shadow rounded-sm flex flex-col md:flex-row shadow-2xl">
                <button onClick={onClose} className="absolute top-4 right-4 z-10 w-10 h-10 bg-white/50 backdrop-blur rounded-full flex items-center justify-center hover:bg-gray-100 transition"><i className="ph ph-x text-xl"></i></button>
                
                {/* Image Gallery Side */}
                <div className="w-full md:w-1/2 bg-offWhite p-8 lg:p-12 flex items-center justify-center relative">
                    {product.badge && <span className="absolute top-8 left-8 bg-charcoal text-white text-[10px] uppercase font-bold px-3 py-1">{product.badge}</span>}
                    <img src={product.img} alt={product.name} className="w-full h-auto object-cover luxury-shadow" />
                </div>

                {/* Details Side */}
                <div className="w-full md:w-1/2 p-8 lg:p-12 flex flex-col">
                    <div className="mb-2 text-xs uppercase tracking-widest text-wood font-bold">{product.subcat}</div>
                    <h2 className="text-3xl lg:text-4xl font-serif text-charcoal mb-4">{product.name}</h2>
                    <div className="flex items-center gap-2 mb-6">
                        <div className="flex text-yellow-500 text-sm">
                            {[...Array(5)].map((_,i) => <i key={i} className={i < Math.floor(product.rating) ? "ph-fill ph-star" : "ph ph-star"}></i>)}
                        </div>
                        <span className="text-sm text-gray-500">({product.reviews} reviews)</span>
                    </div>
                    <div className="text-2xl font-medium text-charcoal mb-8">{formatINR(product.price)}</div>

                    <p className="text-gray-600 mb-8 font-light leading-relaxed">{product.desc}</p>

                    <div className="flex items-center gap-6 mb-10">
                        <div className="flex border border-gray-300">
                            <button onClick={()=>setQty(Math.max(1, qty-1))} className="px-4 py-2 hover:bg-gray-100"><i className="ph ph-minus"></i></button>
                            <span className="px-4 py-2 text-sm font-medium">{qty}</span>
                            <button onClick={()=>setQty(qty+1)} className="px-4 py-2 hover:bg-gray-100"><i className="ph ph-plus"></i></button>
                        </div>
                        <button onClick={() => { onAddToCart(product, qty); onClose(); }} className="flex-1 bg-charcoal text-white py-4 uppercase tracking-widest text-sm font-medium hover:bg-wood transition-colors">Add to Cart</button>
                    </div>

                    {/* Tabs area */}
                    <div className="border-t border-gray-200 pt-6 mt-auto">
                        <div className="flex gap-6 mb-4 text-sm font-medium uppercase tracking-wider text-gray-500 overflow-x-auto hide-scrollbar">
                            <button onClick={()=>setActiveTab('about')} className={activeTab==='about'?'text-charcoal border-b border-charcoal':'hover:text-charcoal'}>About Product</button>
                            <button onClick={()=>setActiveTab('specs')} className={activeTab==='specs'?'text-charcoal border-b border-charcoal':'hover:text-charcoal'}>Specifications</button>
                        </div>

                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                        {cart.length > 0 && (

};

// --- APP COMPONENT ---
function App() {
    const [cart, setCart] = useState([]);
    const [isCartOpen, setIsCartOpen] = useState(false);
    const [selectedProduct, setSelectedProduct] = useState(null);
    const [activePage, setActivePage] = useState('home');

    // Cart Handlers
    const handleAddToCart = (product, qty) => {
        setCart(prev => {
            const exists = prev.find(item => item.product.id === product.id);
            if(exists) return prev.map(item => item.product.id === product.id ? { ...item, qty: item.qty + qty } : item);
            return [...prev, { product, qty }];
        });
        setIsCartOpen(true);
    };

    const handleRemoveFromCart = (id) => setCart(prev => prev.filter(item => item.product.id !== id));
    
    const handleUpdateQty = (id, newQty) => {
        if(newQty < 1) return;
        setCart(prev => prev.map(item => item.product.id === id ? { ...item, qty: newQty } : item));
    };

    const navigate = (pageId) => {
        setActivePage(pageId);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    return (
        <div className="min-h-screen flex flex-col">
            <Navbar cartCount={cart.reduce((sum, item) => sum + item.qty, 0)} onOpenCart={() => setIsCartOpen(true)} onNavigate={navigate} activePage={activePage} />
            
            <main className="flex-grow">
                {activePage === 'home' && (
                    <motion.div initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}}>
                        <Hero onNavigate={navigate} />
                        <CategoryShowcase onNavigate={navigate} />
                        <RoomInspiration />
                        <WhyChooseUs />
                    </motion.div>
                )}

                {activePage === 'products' || activePage === 'collections' ? (
                    <motion.div initial={{opacity:0}} animate={{opacity:1}} className="pt-24">
                        <ProductShowcase onOpenDetail={setSelectedProduct} />
                    </motion.div>
                ) : null}

                {activePage === 'inspiration' ? (
                    <motion.div initial={{opacity:0}} animate={{opacity:1}} className="pt-24">
                        <RoomInspiration />
                    </motion.div>
                ) : null}

                {activePage === 'about' || activePage === 'contact' ? (
                    <motion.div initial={{opacity:0}} animate={{opacity:1}} className="pt-24 min-h-screen">
                        <ContactAbout />
                    </motion.div>
                ) : null}
            </main>

            <Footer />

            <AnimatePresence>
                {selectedProduct && <ProductDetailModal product={selectedProduct} onClose={() => setSelectedProduct(null)} onAddToCart={handleAddToCart} />}
            </AnimatePresence>

            <CartDrawer isOpen={isCartOpen} onClose={() => setIsCartOpen(false)} cart={cart} onRemove={handleRemoveFromCart} onUpdateQty={handleUpdateQty} />
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
